{% extends 'archive_app/navbar.html' %}

{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/family-chart@0.9.0/dist/styles/family-chart.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/family-chart@0.9.0/dist/family-chart.min.js"></script>

<div id="tree-wrap" class="relative">
    <div id="tree" class="f3"></div>

    <!-- Person details, filled in on card click -->
    <aside id="person-panel" class="hidden absolute inset-x-4 bottom-4 sm:inset-x-auto sm:bottom-auto sm:top-4 sm:right-4 z-10 sm:w-72 max-h-[60%] sm:max-h-[calc(100%-2rem)] overflow-y-auto bg-white rounded-2xl shadow-lg ring-1 ring-slate-100 p-5">
        <button id="person-panel-close" class="absolute top-3 right-3 p-1 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" aria-label="Close">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
        </button>
        <div id="person-panel-body"></div>
    </aside>
</div>

{{ tree_data|json_script:"tree-data" }}
{{ main_id|json_script:"main-id" }}
<script>
    const DEFAULT_AVATAR = "{% static 'default_profile.jpg' %}";
    const treeData = JSON.parse(document.getElementById('tree-data').textContent);
    const mainId = JSON.parse(document.getElementById('main-id').textContent);
    const peopleById = Object.fromEntries(treeData.map(p => [p.id, p]));

    // family-chart inserts card HTML with innerHTML, so escape everything from the database
    function esc(value) {
        const div = document.createElement('div');
        div.textContent = value ?? '';
        return div.innerHTML;
    }

    function lifespan(p) {
        if (!p.birth_year && !p.death_year) return '';
        return `${p.birth_year ?? '?'} – ${p.death_year ?? ''}`;
    }

    function cardHtml(d) {
        const p = d.data.data;
        return `
        <div class="card-inner tree-card">
            <img src="${esc(p.avatar || DEFAULT_AVATAR)}" onerror="this.onerror=null;this.src=DEFAULT_AVATAR" alt="" class="tree-card-photo">
            <div class="min-w-0">
                <div class="tree-card-name">${esc(p.name)}</div>
                <div class="tree-card-years">${esc(lifespan(p))}</div>
            </div>
        </div>`;
    }

    function row(label, value) {
        if (!value) return '';
        return `<div><dt class="text-xs font-medium uppercase tracking-wide text-slate-400">${label}</dt>
                <dd class="text-sm text-slate-700">${esc(value)}</dd></div>`;
    }

    function showPerson(id) {
        const person = peopleById[id];
        const p = person.data;
        const parents = person.rels.parents.map(pid => peopleById[pid]?.data.name).filter(Boolean).join(' & ');
        const marriages = p.marriages.map(m => row(
            'Married',
            [m.partner, m.date, m.location].filter(Boolean).join(', ')
        )).join('');
        document.getElementById('person-panel-body').innerHTML = `
            <div class="flex flex-col items-center text-center mb-4">
                <img src="${esc(p.avatar || DEFAULT_AVATAR)}" onerror="this.onerror=null;this.src=DEFAULT_AVATAR" alt="" class="w-24 h-24 rounded-full object-cover ring-4 ${p.gender === 'F' ? 'ring-rose-200' : 'ring-brand-200'}">
                <h2 class="mt-3 text-lg font-bold text-slate-800">${esc(p.name)}</h2>
                <p class="text-sm text-slate-500">${esc(lifespan(p))}</p>
            </div>
            <dl class="space-y-3">
                ${row('Born', [p.birth_date, p.birth_location].filter(Boolean).join(', '))}
                ${row('Died', p.death_date)}
                ${row('Parents', parents)}
                ${marriages}
                ${row('Email', p.email)}
                ${row('Phone', p.phone_number)}
            </dl>`;
        document.getElementById('person-panel').classList.remove('hidden');
    }

    document.getElementById('person-panel-close').addEventListener('click', () => {
        document.getElementById('person-panel').classList.add('hidden');
    });

    const chart = f3.createChart('#tree', treeData)
        .setTransitionTime(800)
        .setCardXSpacing(270)
        .setCardYSpacing(150)
        .setSingleParentEmptyCard(false)
        .setShowSiblingsOfMain(true);

    const card = chart.setCardHtml()
        .setMiniTree(true)
        .setCardInnerHtmlCreator(cardHtml)
        .setOnCardClick((e, d) => {
            card.onCardClickDefault(e, d);  // re-centre the tree on this person
            showPerson(d.data.id);
        });

    chart.setPersonDropdown(d => d.data.name, {
        placeholder: 'Find a person…',
        onSelect: id => {
            chart.updateMainId(id);
            chart.updateTree({initial: false});
            showPerson(id);
        },
    });

    if (mainId) chart.updateMainId(mainId);
    chart.updateTree({initial: true});
</script>
{% endblock %}
