{% comment %}
  Drag & drop file picker driven by static/js/media.js.
  Must sit inside a <form enctype="multipart/form-data">. Pass show_submit=True to render an upload button.
{% endcomment %}
<input type="file" id="file-input" name="images" multiple accept="image/*,video/*" class="hidden">

<div id="drop-zone" class="drop-zone group" onclick="document.getElementById('file-input').click()">
  <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-brand-50 flex items-center justify-center group-hover:bg-brand-100 transition-colors">
    <svg class="w-7 h-7 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
    </svg>
  </div>
  <p class="text-slate-700 font-semibold mb-1">Drop photos &amp; videos here</p>
  <p class="text-sm text-slate-400">or <span class="text-brand-600 font-medium">click to browse</span></p>
</div>

<div id="preview-strip" class="preview-strip" style="display:none"></div>

<div id="upload-actions" class="flex items-center justify-between mt-4 pt-4 border-t border-slate-100" style="display:none !important">
  <span id="file-count" class="text-sm text-slate-500"></span>
  {% if show_submit %}
  <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition-colors shadow-sm">
    Upload
  </button>
  {% endif %}
</div>
